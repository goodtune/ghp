services:
  vault:
    image: hashicorp/vault:1.21
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: vault-dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    command: server -dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  vault-init:
    image: hashicorp/vault:1.21
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: vault-dev-root-token
    volumes:
      - ./vault:/vault/config:ro
    depends_on:
      vault:
        condition: service_healthy
    entrypoint: ["sh", "/vault/config/init.sh"]
    restart: "no"
