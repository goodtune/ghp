# Token profile catalogue (spec section 3.3). Scopes use enforcement names.
- name: open
  type: proxy
  duration: 2h
- name: perm-ro
  type: proxy
  scopes: "contents:read,issues:read,pull_requests:read,metadata:read,actions:read"
  duration: 2h
- name: perm-rw
  type: proxy
  scopes: "contents:write,issues:write,pull_requests:write"
  duration: 2h
- name: perm-issues-ro
  type: proxy
  scopes: "issues:read"
  duration: 2h
- name: perm-metadata-ro
  type: proxy
  scopes: "metadata:read"
  duration: 2h
- name: repo-A
  type: proxy
  repositories: ["{{.RepoA}}"]
  duration: 2h
- name: repo-AB
  type: proxy
  repositories: ["{{.RepoA}}", "{{.RepoB}}"]
  duration: 2h
- name: repo-W
  type: proxy
  repositories: ["{{.RepoW}}"]
  duration: 2h
- name: repo-A-perm-ro
  type: proxy
  repositories: ["{{.RepoA}}"]
  scopes: "contents:read,metadata:read"
  duration: 2h
- name: perm-contents-ro-W
  type: proxy
  repositories: ["{{.RepoW}}"]
  scopes: "contents:read"
  duration: 2h
- name: perm-contents-rw-W
  type: proxy
  repositories: ["{{.RepoW}}"]
  scopes: "contents:write"
  duration: 2h
- name: lifecycle-default
  type: proxy
- name: lifecycle-revoke
  type: proxy
  duration: 2h
- name: lifecycle-expire
  type: proxy
  duration: 1m
# Agent (gha_) profiles (#306). Minted against instance.agent_installation
# (app_record_id and installation_id in rig/config.yaml); never the
# instance's default app. Skipped, and their scenarios report GAP, unless
# the agent_installation capability is true.
- name: agent-open
  type: agent
  duration: 1h
  requires: [agent_installation]
- name: agent-repo-A
  type: agent
  repositories: ["{{.RepoA}}"]
  duration: 1h
  requires: [agent_installation]
- name: agent-repo-W
  type: agent
  repositories: ["{{.RepoW}}"]
  duration: 1h
  requires: [agent_installation]
- name: agent-perm-ro
  type: agent
  scopes: "contents:read,issues:read,pull_requests:read,metadata:read,actions:read"
  duration: 1h
  requires: [agent_installation]
