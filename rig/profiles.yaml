# Token profile catalogue (spec section 3.3). Scopes use enforcement names.
- name: open
  type: proxy
  duration: 2h
- name: perm-ro
  type: proxy
  scopes: "contents:read,issues:read,pull_requests:read,metadata:read,actions:read"
  duration: 2h
- name: perm-rw
  type: proxy
  scopes: "contents:write,issues:write,pull_requests:write"
  duration: 2h
- name: perm-issues-ro
  type: proxy
  scopes: "issues:read"
  duration: 2h
- name: repo-A
  type: proxy
  repositories: ["{{.RepoA}}"]
  duration: 2h
- name: repo-AB
  type: proxy
  repositories: ["{{.RepoA}}", "{{.RepoB}}"]
  duration: 2h
- name: repo-W
  type: proxy
  repositories: ["{{.RepoW}}"]
  duration: 2h
- name: repo-A-perm-ro
  type: proxy
  repositories: ["{{.RepoA}}"]
  scopes: "contents:read,metadata:read"
  duration: 2h
- name: perm-contents-ro-W
  type: proxy
  repositories: ["{{.RepoW}}"]
  scopes: "contents:read"
  duration: 2h
- name: lifecycle-default
  type: proxy
- name: lifecycle-revoke
  type: proxy
  duration: 2h
