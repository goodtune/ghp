# Token lifecycle scenarios (spec section 7: LIFE-C37, C38, C40; GAP-A5 for #293).
- id: LIFE-C37.default-duration
  claim: LIFE-C37
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: >-
    A token created without a duration expires after the instance default
    (instance.default_duration). The window allows 2m either side for clock
    skew between the rig and the instance.
  kind: token_api
  request: {method: POST, path: /api/tokens, body: {session_id: "scoperig-{{.RunID}}"}}
  expect:
    status: 201
    expires_within: {field: expires_at, min: "{{add .Instance.DefaultDuration \"-2m\"}}", max: "{{add .Instance.DefaultDuration \"2m\"}}"}

- id: LIFE-C37.explicit-duration
  claim: LIFE-C37
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: >-
    A token created with an explicit duration (1h) expires after that
    duration, not the default. The window allows 2m either side for clock
    skew.
  kind: token_api
  request: {method: POST, path: /api/tokens, body: {type: proxy, duration: 1h, session_id: "scoperig-{{.RunID}}"}}
  expect:
    status: 201
    expires_within: {field: expires_at, min: 58m, max: 62m}

- id: LIFE-C38.max-duration
  claim: LIFE-C38
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: A duration over the instance maximum is rejected. If the server returns 201 the manager revokes the new token.
  kind: token_api
  request: {method: POST, path: /api/tokens, body: {type: proxy, duration: "{{add .Instance.MaxDuration \"1h\"}}", session_id: "scoperig-{{.RunID}}"}}
  expect: {status: 400}

- id: LIFE-C40.revoked-rejected
  claim: LIFE-C40
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: A revoked token is rejected within the 30 s resolution cache window.
  profile: lifecycle-revoke
  kind: token_api
  steps:
    - {name: before, method: GET, path: /api/v3/user, expect: {status: 200}}
    - {name: revoke, method: DELETE, path: "/api/tokens/{{index .ProfileIDs \"lifecycle-revoke\"}}", expect: {status_in: [200, 204]}}
    - {name: probe, method: GET, path: /api/v3/user, expect: {status: 401, body_contains: ["token has been revoked"]}}
  poll: {interval: 2s, timeout: 35s}

- id: GAP-A5.pulls-alias-rejected
  claim: GAP-A5
  doc: docs/features/token-scoping.md#valid-permission-names
  description: >-
    Token creation rejects a non-canonical permission name (#293). The GitHub
    permission is pull_requests; pulls:write must be refused with 400 and a
    message that lists the valid names. If the server returns 201 the manager
    revokes the new token.
  kind: token_api
  request: {method: POST, path: /api/tokens, body: {type: proxy, scopes: "pulls:write", session_id: "scoperig-{{.RunID}}"}}
  expect: {status: 400, body_contains: ["pull_requests"]}

# LIFE-C41: lifecycle-expire is minted at run start with the shortest useful
# duration (1m; the API has no minimum). The probe polls until the token is
# rejected as expired; the timeout covers the 1m lifetime, the 30 s
# resolution cache and clock skew when the scenario runs first.
- id: LIFE-C41.expired-rejected
  claim: LIFE-C41
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: A token is rejected with 401 "token has expired" once its duration passes.
  profile: lifecycle-expire
  kind: token_api
  steps:
    - {name: probe, method: GET, path: /api/v3/user, expect: {status: 401, body_contains: ["token has expired"], ghp_denial: true}}
  poll: {interval: 5s, timeout: 150s}

# LIFE-C39: the instance does not expose tokens.allow_no_expiry, so the
# operator declares it (instance.allow_no_expiry: false in rig/config.yaml)
# and the scenario reports GAP until then. If the server returns 201 the
# manager revokes the never-expiring token.
- id: LIFE-C39.never-refused
  claim: LIFE-C39
  doc: docs/features/token-scoping.md#expiration-and-revocation
  description: >-
    A token with duration "never" is refused with 400 on an instance
    without tokens.allow_no_expiry.
  kind: token_api
  requires: [no_expiry_disallowed]
  request: {method: POST, path: /api/tokens, body: {type: proxy, duration: never, session_id: "scoperig-{{.RunID}}"}}
  expect: {status: 400, body_contains: ["no-expiry tokens are not allowed"]}
