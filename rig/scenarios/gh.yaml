  profile: open
  kind: gh
  repo: A
  args: ["pr", "list", "--limit", "5"]
  expect: {exit_code: 0, stdout_contains: ["{{.Fixture.A.PRTitle}}"]}

- id: GH-C51.pr-list.perm-ro
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
  description: "gh pr list with the perm-ro token. Note: gh sends object fields the analyzer has no table entry for."
  profile: perm-ro
  kind: gh
  repo: A
  args: ["pr", "list", "--limit", "5"]
  expect: {exit_code: 0, stdout_contains: ["{{.Fixture.A.PRTitle}}"]}
  known_issue: https://github.com/goodtune/ghp/issues/298
  observed: {exit_code: 1, stderr_contains: ["GraphQL request references unmapped fields"]}

- id: GH-C51.pr-list.repo-A
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
  description: "gh pr list with the repo-A token. Note: gh sends unmapped object fields; after #298 the Release_fields probe has no repository selection, so a repository-scoped token is expected to be denied as no_repo_ref (not by the unpinned lookup, #297)."
  profile: repo-A
  kind: gh
  repo: A
  args: ["pr", "list", "--limit", "5"]
  expect: {exit_code: 0, stdout_contains: ["{{.Fixture.A.PRTitle}}"]}
  known_issue: https://github.com/goodtune/ghp/issues/298
  observed: {exit_code: 1, stderr_contains: ["GraphQL request references unmapped fields"]}

