- id: GH-C51.pr-view.perm-ro
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
  description: "gh pr view with the perm-ro token. Note: since #298 every field gh sends is classified; StatusCheckRollup.contexts needs checks:read and the StatusContext items need statuses:read, which perm-ro does not grant, so the query is denied for missing scopes."
  profile: perm-ro
  kind: gh
  repo: A
  args: ["pr", "view", "{{.Fixture.A.PRNumber}}"]
  expect: {exit_code: 0, stdout_contains: ["{{.Fixture.A.PRTitle}}"]}
  known_issue: https://github.com/goodtune/ghp/issues/298
  observed: {exit_code: 1, stderr_contains: ["Token does not grant required GraphQL scopes"]}

