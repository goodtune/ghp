# gh CLI command matrix (GH-C51): 11 read-only gh commands x profiles open,
# perm-ro and repo-A, all against repository A. Expectations come from the
# gh 2.102.0 query corpus (rig/corpus/gh/2.102.0, `current` verdicts) and
# consensus A9. Since #298 every field gh 2.102.0 sends is classified.
# Commands that still fail for a profile keep known_issue + observed with
# the reason in the description (perm-ro lacks checks, statuses,
# administration or projects; the release-list probe has no repository).
# gh passes owner/name as String variables; since #297 these pin the
# repository for repo-scoped tokens.
# The fixture PR has no checks, so `gh pr checks` exits 1 with
# "no checks reported" when it works; exit_code_in: [0, 1] covers both.
# No gh writes in this file.

- id: GH-C51.repo-view.open
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
  description: "gh repo view with the open token."
  profile: open
  kind: gh
  repo: A
  args: ["repo", "view", "{{.Host}}/{{.RepoA}}"]
  expect: {exit_code: 0, stdout_contains: ["{{.RepoA.Name}}"]}

- id: GH-C51.repo-view.perm-ro
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
  description: "gh repo view with the perm-ro token."
  profile: perm-ro
  kind: gh
  repo: A
  args: ["repo", "view", "{{.Host}}/{{.RepoA}}"]
  expect: {exit_code: 0, stdout_contains: ["{{.RepoA.Name}}"]}

- id: GH-C51.repo-view.repo-A
  claim: GH-C51
  doc: docs/getting-started.md#configure-your-agent
