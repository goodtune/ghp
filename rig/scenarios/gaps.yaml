# GAP probes (spec section 7; consensus section A). Expectations are the
# DESIRED behaviour. known_issue and observed record today's behaviour from
# the first live run (20261105T0534Z). GAP-A1 and GAP-A2 are fixed (#290,
# #291). GAP-A7 passed (GHP denies the dot-segment path for B), so it
# carries no known_issue; GAP-A6 needs the
# agent_installation capability and has not run yet.
#
# Consensus issue links, for triage: A1 goodtune/ghp#290, A2 #291,
# A3 #292, A6 #294, A7 #295, A8 #296.

# GAP-A1: DELETE git/refs needs contents:write (#290). Before the fix it was
# forwarded unchecked (GitHub answered 422 for the absent ref). The ref never
# exists, so a forwarded request is harmless. The path targets W only.
- id: GAP-A1.delete-ref-contents-ro
  claim: GAP-A1
  doc: docs/features/token-scoping.md#permission-restrictions
  description: contents:read must not delete a ref on W (unmapped write endpoint).
  profile: perm-contents-ro-W
  kind: rest
  requires: [repo_w_push]
  method: DELETE
  path: /repos/{{.RepoW}}/git/refs/heads/scoperig-absent-{{.RunID}}
  expect: {status: 403, ghp_denial: true}

- id: GAP-A2.repositories-by-id
  claim: GAP-A2
  doc: docs/how-it-works.md#request-flow
  description: A token scoped to A must not read B through /repositories/{id}.
  profile: repo-A
  kind: rest
  method: GET
  path: /repositories/{{.RepoB.ID}}
  expect: {status: 403, ghp_denial: true}

# GAP-A3: sent to the instance with TLS SNI and Host github.com (the
# github.com virtual host), path without /api/v3.
- id: GAP-A3.github-vhost-archive
  claim: GAP-A3
  doc: docs/how-it-works.md#virtualhost-routing
  description: A token scoped to A must not download B's archive through the github.com vhost.
  profile: repo-A
  kind: rest
  requires: [github_vhost]
  vhost: github.com
  method: GET
  path: /{{.RepoB}}/archive/HEAD.tar.gz
  # Fixed by #292: before the fix no scope check ran and GitHub answered 404
  # (run 20261105T0534Z). GHP now denies the request itself.
  expect: {status: 403, ghp_denial: true}

# GAP-A6: an agent (gha_) token for an owner/repo repository. Notes:
# - Creation reads the installation account (GET /app/installations/{id})
#   and returns 400 when an owner is not that account (#294). The
#   installation token is minted lazily on the first proxied request, with
#   bare repository names, so a 201 does not show that GitHub narrows the
#   token. A probe that sends a request with the new gha_ token is follow-up
#   work (#306; the executor never sees the raw token).
# - Revocation: token.Service.Revoke marks the record revoked and drops the
#   cache entry; it does not call DELETE /installation/token. A minted
#   installation token stays valid at GitHub until its natural expiry (up to
#   1h) and stays in GHP's in-memory cache for up to 55m. It never leaves
#   GHP, so the leftover exposure is server-side only; requests with the
#   revoked gha_ token are refused.
- id: GAP-A6.agent-mint
  claim: GAP-A6
  doc: docs/admin/github-app.md#agent-tokens-gha_
  description: An agent token for an owner/repo repository is created.
  kind: token_api
  requires: [agent_installation]
  request:
    method: POST
    path: /api/tokens
    body:
      type: agent
      repositories: ["{{.RepoA}}"]
      installation_id: "$int:InstallationID"
      duration: 1h
      session_id: "scoperig-{{.RunID}}"
  expect: {status: 201}

# GAP-A7: the path is sent verbatim (URL.Opaque). The validator allows dot
# segments for this scenario ID only, and only on GET.
- id: GAP-A7.dotdot-path
  claim: GAP-A7
  doc: docs/features/token-scoping.md#repository-restrictions
  description: Dot segments after A must not reach B's contents.
  profile: repo-A
  kind: rest
  method: GET
  path: /repos/{{.RepoA}}/../../{{.RepoB}}/contents/README.md
  # GHP rejects dot segments before any lookup (#295).
  expect:
    status: 403
    ghp_denial: true
    body_not_contains: ['"path": "README.md"', '"path":"README.md"']

# GAP-A8: the management host's GHES-style paths (/api/v3/, /api/graphql)
# accept only ghx_/gha_ tokens. An empty Authorization header overrides the
# profile token, so the request reaches GHP with no credential. The native
# token is fake (built from the run ID, as in BORDER-C43); it is 403 whether
# or not the border policy blocks gho_, so the message is not asserted.
- id: GAP-A8.anonymous-rest
  claim: GAP-A8
  doc: docs/how-it-works.md#security-model
  description: An anonymous REST request to the management host is 401, not forwarded to GitHub.
  profile: open
  kind: rest
  method: GET
  path: /user
  headers: {Authorization: ""}
  expect: {status: 401, body_contains: ["Authentication with a GHP-issued token (ghx_ or gha_) is required"], ghp_denial: true}

- id: GAP-A8.anonymous-graphql
  claim: GAP-A8
  doc: docs/how-it-works.md#security-model
  description: An anonymous GraphQL request to the management host is 401, not forwarded to GitHub.
  profile: open
  kind: graphql
  query: "{ viewer { login } }"
  headers: {Authorization: ""}
  expect: {status: 401, body_contains: ["Authentication with a GHP-issued token (ghx_ or gha_) is required"], ghp_denial: true}

- id: GAP-A8.native-token-rest
  claim: GAP-A8
  doc: docs/how-it-works.md#security-model
  description: A native gho_ token on the management host is 403 regardless of the border policy.
  profile: open
  kind: rest
  method: GET
  path: /user
  headers: {Authorization: "token gho_{{printf \"%.36s\" (print .RunID \"scoperigfakescoperigfakescoperigfake\")}}"}
  expect: {status: 403, ghp_denial: true}

# GAP-A10: root nodes(ids:) with an inline fragment used to pass for any
# permission-scoped token, because `nodes` is always allowed as a
# Connection helper (#324). GHP now requires the scope of each fragment
# type condition, so a metadata:read token is denied issues:read. The
# denial is static (before any lookup), so the ID is the repository node ID:
# a metadata:read token cannot read an issue node ID to use instead.
- id: GAP-A10.nodes-fragment-bypass
  claim: GAP-A10
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Root nodes(ids:) with an Issue fragment needs issues:read; a metadata:read token is denied by GHP.
  profile: perm-metadata-ro
  kind: graphql
  query: |
    { nodes(ids: ["{{.RepoA.NodeID}}"]) { ... on Issue { title body } } }
  expect: {status: 403, body_contains: ["Token does not grant required GraphQL scopes", "issues:read"], ghp_denial: true}

# GAP-A4: the codeload.github.com virtual host. The unknown token is fake
# (the run ID padded to the length of a real ghx_ token); GHP must reject it
# with its own denial and never forward it. The Authorization header
# overrides the profile token.
- id: GAP-A4.codeload-unknown-token
  claim: GAP-A4
  doc: docs/how-it-works.md#virtualhost-routing
  description: An unknown ghx_ token on codeload.github.com is rejected by GHP, not forwarded to GitHub.
  profile: open
  kind: rest
  requires: [codeload_vhost]
  vhost: codeload.github.com
  method: GET
  path: /{{.RepoA}}/tar.gz/{{.Fixture.A.Branch}}
  headers: {Authorization: "token ghx_{{printf \"%.40s\" (print .RunID \"scoperigfakescoperigfakescoperigfakescoperigfake\")}}"}
  expect: {status: 401, ghp_denial: true}

- id: GAP-A4.codeload-repo-a-archive
  claim: GAP-A4
  doc: docs/how-it-works.md#virtualhost-routing
  description: A token scoped to A fetches A's archive through codeload.github.com (GHP swaps in the real credential).
  profile: repo-A
  kind: rest
  requires: [codeload_vhost]
  vhost: codeload.github.com
  method: GET
  path: /{{.RepoA}}/tar.gz/{{.Fixture.A.Branch}}
  expect: {status: 200, ghp_denial: false}

- id: GAP-A4.codeload-repo-b-denied
  claim: GAP-A4
  doc: docs/how-it-works.md#virtualhost-routing
  description: A token scoped to A is denied B's archive through codeload.github.com.
  profile: repo-A
  kind: rest
  requires: [codeload_vhost]
  vhost: codeload.github.com
  method: GET
  path: /{{.RepoB}}/tar.gz/{{.Fixture.B.Branch}}
  expect: {status: 403, ghp_denial: true}

# GAP-A9: replay the gh 2.102.0 corpus live. Load expands this entry into one
# graphql scenario per corpus query and profile; each asserts the corpus
# verdict (allow: 200 and no GHP denial; deny: 403 with the reason's GHP
# message). OWNER, REPO and NODE_ID become fixture A's values. Numbers
# (pull request and issue 1) are kept: an allowed query may get a GraphQL
# error from GitHub for them, which is not GHP's verdict.
- id: GAP-A9.gh-2.102.0
  claim: GAP-A9
  doc: docs/getting-started.md#configure-your-agent
  description: The GraphQL analyzer gives gh 2.102.0's real queries the corpus verdicts live.
  kind: corpus
  corpus: corpus/gh/2.102.0
  corpus_profiles: {open: open, perm-ro: perm-ro, repo: repo-A}
