# GraphQL scope enforcement scenarios (spec section 7: GQL-C24 to C33,
# iteration-1 subset). Every 403 asserts ghp_denial so a GitHub-side error
# cannot pass for a GHP denial. Messages are from
# internal/proxy/graphql_verdict.go.
- id: GQL-C24.viewer-no-repo-ref
  claim: GQL-C24
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A repository-restricted token cannot send a query with no repository(owner, name).
  profile: repo-A
  kind: graphql
  query: "{ viewer { login } }"
  expect: {status: 403, body_contains: ["must reference repository(owner, name)"], ghp_denial: true}

- id: GQL-C25.repo-a-literal-b
  claim: GQL-C25
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A token scoped to A cannot look up B by literal arguments.
  profile: repo-A
  kind: graphql
  query: |
    { repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name } }
  expect: {status: 403, body_contains: ["Token is not scoped to"], ghp_denial: true}

- id: GQL-C25.repo-ab-literal-a-and-b
  claim: GQL-C25
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Control - a token scoped to A and B can look up both by literal arguments.
  profile: repo-AB
  kind: graphql
  query: |
    {
      a: repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      b: repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name }
    }
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.a.name": "{{.RepoA.Name}}", "$.data.b.name": "{{.RepoB.Name}}"}

# GQL-C26: root search/node selecting only counts or id have no fragment type
# to gate on, and the unmapped-field check runs before the cross-repository
# check, so their verdict is deny:unmapped (ruling from the Task 1 review).
# viewer.repositories is mapped since #341, so it reaches the cross-repository
# check (#343). The claim (rejected for repository-scoped tokens) holds either
# way; the expectations pin today's message.
- id: GQL-C26.search-root
  claim: GQL-C26
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Root search is rejected for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      search(query: "scoperig", type: REPOSITORY, first: 1) { repositoryCount }
    }
  expect: {status: 403, body_contains: ["GraphQL request references unmapped fields", "search"], ghp_denial: true}

- id: GQL-C26.node-root
  claim: GQL-C26
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Root node(id:) is rejected for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      node(id: "{{.RepoB.NodeID}}") { id }
    }
  expect: {status: 403, body_contains: ["GraphQL request references unmapped fields", "node"], ghp_denial: true}

- id: GQL-C26.viewer-repositories
  claim: GQL-C26
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: viewer.repositories is rejected for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      viewer { repositories(first: 1) { totalCount } }
    }
  expect: {status: 403, body_contains: ["uses cross-repository fields", "repositories"], ghp_denial: true}

- id: GQL-C26.aliased-search
  claim: GQL-C26
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An aliased root search is still rejected (the analyzer checks field names, not aliases).
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      innocuous: search(query: "scoperig", type: REPOSITORY, first: 1) { repositoryCount }
    }
  expect: {status: 403, body_contains: ["GraphQL request references unmapped fields", "search"], ghp_denial: true}

# GQL-C26, metadata-only subtrees (#339) and parent-aware connections (#340).
# Every deny names the cross-repository field as <parent>.<field>.
- id: GQL-C26.head-repository-issues
  claim: GQL-C26
  doc: docs/features/token-scoping.md#cross-repository-subtrees
  description: headRepository is a metadata-only subtree; issues beneath it are rejected for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") {
        pullRequests(first: 1) { nodes { headRepository { issues(first: 1) { nodes { body } } } } }
      }
    }
  expect: {status: 403, body_contains: ["uses cross-repository fields", "headRepository.issues"], ghp_denial: true}

- id: GQL-C26.head-repository-metadata
  claim: GQL-C26
  doc: docs/features/token-scoping.md#cross-repository-subtrees
  description: Control - metadata under headRepository is allowed for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") {
        name
        pullRequests(first: 1) { nodes { headRepository { nameWithOwner } } }
      }
    }
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C26.repository-parent-issues
  claim: GQL-C26
  doc: docs/features/token-scoping.md#cross-repository-subtrees
  description: Repository.parent is a metadata-only subtree; issues beneath it are rejected for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") {
        parent { issues(first: 1) { nodes { body } } }
      }
    }
  expect: {status: 403, body_contains: ["uses cross-repository fields", "parent.issues"], ghp_denial: true}

- id: GQL-C26.viewer-issues
  claim: GQL-C26
  doc: docs/features/token-scoping.md#cross-repository-subtrees
  description: viewer.issues beside a pinned repository is rejected for a repository-scoped token (it spans every repository).
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name }
      viewer { issues(first: 1) { nodes { body } } }
    }
  expect: {status: 403, body_contains: ["uses cross-repository fields", "viewer.issues"], ghp_denial: true}

- id: GQL-C26.author-user-pull-requests
  claim: GQL-C26
  doc: docs/features/token-scoping.md#cross-repository-subtrees
  description: author { ... on User { pullRequests } } is rejected for a repository-scoped token (User.pullRequests spans every repository).
  profile: repo-A
  kind: graphql
  query: |
    {
      repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") {
        issues(first: 1) { nodes { author { ... on User { pullRequests(first: 1) { nodes { body } } } } } }
      }
    }
  expect: {status: 403, body_contains: ["uses cross-repository fields", "author.pullRequests"], ghp_denial: true}

- id: GQL-C24.introspection-only
  claim: GQL-C24
  doc: docs/features/token-scoping.md#introspection-only-queries
  description: Control - an introspection-only query (gh's PullRequest_fields2 probe) needs no repository(owner, name) for a repository-scoped token (#342).
  profile: repo-A
  kind: graphql
  query: |
    query PullRequest_fields2 { WorkflowRun: __type(name: "WorkflowRun") { fields(includeDeprecated: true) { name } } }
  expect:
    status: 200
    body_not_contains: ['"errors"']

# GQL-C27: the mutation is denied before it reaches GitHub. It still targets
# only W (repositoryId captured from a query that pins W) and requires
# repo_w_push, so a regression that forwards it cannot touch A or B.
- id: GQL-C27.createissue-repo-w
  claim: GQL-C27
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A repository-scoped token cannot send a mutation, even for its own repository.
  profile: repo-W
  kind: graphql
  requires: [repo_w_push]
  steps:
    - name: repo
      method: POST
      path: /graphql
      body:
        query: |
          { repository(owner: "{{.RepoW.Owner}}", name: "{{.RepoW.Name}}") { id } }
      expect: {status: 200}
      capture: {rid: "$.data.repository.id"}
    - name: create
      method: POST
      path: /graphql
      body:
        query: |
          mutation($rid: ID!) { createIssue(input: {repositoryId: $rid, title: "scoperig {{.RunID}} C27", body: "automated; must be denied"}) { issue { number } } }
        variables: {rid: "{{.Step.repo.rid}}"}
      expect: {status: 403, body_contains: ["GraphQL mutations are not supported"], ghp_denial: true}

- id: GQL-C28.variable-allowed
  claim: GQL-C28
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: String variables with string values pin the repository; a token scoped to A can look up A.
  profile: repo-A
  kind: graphql
  query: |
    query($o: String!, $n: String!) { repository(owner: $o, name: $n) { name } }
  variables: {o: "{{.RepoA.Owner}}", n: "{{.RepoA.Name}}"}
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C28.variable-other-repo
  claim: GQL-C28
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A token scoped to A cannot look up B through variables.
  profile: repo-A
  kind: graphql
  query: |
    query($o: String!, $n: String!) { repository(owner: $o, name: $n) { name } }
  variables: {o: "{{.RepoB.Owner}}", n: "{{.RepoB.Name}}"}
  expect: {status: 403, body_contains: ["Token is not scoped to"], ghp_denial: true}

- id: GQL-C28.variable-absent
  claim: GQL-C28
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A variable with no value in the variables object does not pin the repository, even with a default value.
  profile: repo-A
  kind: graphql
  query: |
    query($o: String! = "{{.RepoA.Owner}}", $n: String! = "{{.RepoA.Name}}") { repository(owner: $o, name: $n) { name } }
  expect: {status: 403, body_contains: ["literal string arguments"], ghp_denial: true}

- id: GQL-C28.mixed-literal-and-variable
  claim: GQL-C28
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A variable-driven lookup of B is rejected even alongside an allowed literal lookup of A.
  profile: repo-A
  kind: graphql
  query: |
    query($o:String!,$n:String!){
      a: repository(owner:"{{.RepoA.Owner}}", name:"{{.RepoA.Name}}"){ name }
      b: repository(owner:$o, name:$n){ name }
    }
  variables: {o: "{{.RepoB.Owner}}", n: "{{.RepoB.Name}}"}
  expect:
    status: 403
    body_contains: ["Token is not scoped to"]
    ghp_denial: true

- id: GQL-C29.pullrequests-needs-scope
  claim: GQL-C29
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: issues:read does not cover a pullRequests selection.
  profile: perm-issues-ro
  kind: graphql
  query: |
    { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { pullRequests(first: 1) { nodes { number } } } }
  expect: {status: 403, body_contains: ["Token does not grant required GraphQL scopes", "pull_requests:read"], ghp_denial: true}

# GQL-C31: these two IDs are the reviewed entries in mutationWriteAllowlist
# (tools/scoperig/scenario/gqlcheck.go). The profiles have no repository
# restriction, so the mutation may only name W: repositoryId is captured from
# a query that pins W.
- id: GQL-C31.createissue-ro-denied
  claim: GQL-C31
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: createIssue needs issues:write; issues:read is denied before GitHub.
  profile: perm-issues-ro
  kind: graphql
  requires: [repo_w_push]
  steps:
    - name: repo
      method: POST
      path: /graphql
      body:
        query: |
          { repository(owner: "{{.RepoW.Owner}}", name: "{{.RepoW.Name}}") { id } }
      expect: {status: 200}
      capture: {rid: "$.data.repository.id"}
    - name: create
      method: POST
      path: /graphql
      body:
        query: |
          mutation($rid: ID!) { createIssue(input: {repositoryId: $rid, title: "scoperig {{.RunID}} C31 ro", body: "automated; must be denied"}) { issue { number } } }
        variables: {rid: "{{.Step.repo.rid}}"}
      expect: {status: 403, body_contains: ["Token does not grant required GraphQL scopes", "issues:write"], ghp_denial: true}

- id: GQL-C31.createissue-rw-allowed
  claim: GQL-C31
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: createIssue on W is allowed with issues:write; the issue is closed in cleanup.
  profile: perm-rw
  kind: graphql
  requires: [repo_w_push]
  steps:
    - name: repo
      method: POST
      path: /graphql
      body:
        query: |
          { repository(owner: "{{.RepoW.Owner}}", name: "{{.RepoW.Name}}") { id } }
      expect: {status: 200}
      capture: {rid: "$.data.repository.id"}
    - name: create
      method: POST
      path: /graphql
      body:
        query: |
          mutation($rid: ID!) { createIssue(input: {repositoryId: $rid, title: "scoperig {{.RunID}} C31", body: "automated; closed immediately"}) { issue { number } } }
        variables: {rid: "{{.Step.repo.rid}}"}
      expect: {status: 200, body_not_contains: ['"errors"']}
      capture: {number: "$.data.createIssue.issue.number"}
  cleanup:
    - method: PATCH
      path: /repos/{{.RepoW}}/issues/{{.Step.create.number}}
      body: {state: closed}

- id: GQL-C32.subscription
  claim: GQL-C32
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: GraphQL subscriptions are rejected.
  profile: perm-ro
  kind: graphql
  query: "subscription { viewer { login } }"
  expect: {status: 403, body_contains: ["GraphQL subscriptions are not supported"], ghp_denial: true}

- id: GQL-C33.unknown-object-field
  claim: GQL-C33
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An unknown object-typed field is rejected (deny by default).
  profile: perm-ro
  kind: graphql
  query: |
    { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { foo { bar } } }
  expect: {status: 403, body_contains: ["unmapped fields: foo"], ghp_denial: true}

# GQL-C22: an open-scoped token skips static analysis, so an unmapped field
# reaches GitHub, which names it in its own error. The perm-ro control shows
# the same query is denied by GHP for a scoped token.
- id: GQL-C22.open-unmapped-forwarded
  claim: GQL-C22
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An open-scoped token's query with an unmapped field is forwarded to GitHub, not analysed.
  profile: open
  kind: graphql
  query: "{ viewer { login scoperigUnmapped { id } } }"
  expect:
    status: 200
    ghp_denial: false
    body_contains: ["scoperigUnmapped"]
    body_not_contains: ["GraphQL request references unmapped fields"]

- id: GQL-C22.scoped-unmapped-denied
  claim: GQL-C22
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Control - the same query with a permission-scoped token is analysed and denied by GHP.
  profile: perm-ro
  kind: graphql
  query: "{ viewer { login scoperigUnmapped { id } } }"
  expect: {status: 403, body_contains: ["unmapped fields: scoperigUnmapped"], ghp_denial: true}

# GQL-C23: the padding is a GraphQL comment of 1,099,999 characters, so the
# body is over the 1 MiB (1,048,576 byte) cap. fmt caps a width at 1e6, so
# the comment is two printf runs.
- id: GQL-C23.scoped-over-cap
  claim: GQL-C23
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A scoped token's GraphQL body over 1 MiB is rejected by GHP with 413.
  profile: perm-ro
  kind: graphql
  query: |
    # {{printf "%0999999d" 0}}{{printf "%0100000d" 0}}
    { viewer { login } }
  expect: {status: 413, body_contains: ["GraphQL request body exceeds proxy size limit"]}

- id: GQL-C23.open-not-capped
  claim: GQL-C23
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An open-scoped token's GraphQL body over 1 MiB is not capped by GHP; it is forwarded and GitHub answers.
  profile: open
  kind: graphql
  query: |
    # {{printf "%0999999d" 0}}{{printf "%0100000d" 0}}
    { viewer { login } }
  expect:
    body_not_contains: ["GraphQL request body exceeds proxy size limit"]
    ghp_denial: false

# GQL-C30: the mutation name does not exist, so a forwarded request would do
# nothing at GitHub. It is in mutationWriteAllowlist (gqlcheck.go) because
# the profile has no repository restriction; it names no repository.
- id: GQL-C30.unmapped-mutation-denied
  claim: GQL-C30
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A mutation that is not in the curated mutation map is rejected for a permission-scoped token, even with write scopes.
  profile: perm-rw
  kind: graphql
  query: |
    mutation { scoperigNoSuchMutation(input: {clientMutationId: "scoperig-{{.RunID}}"}) { clientMutationId } }
  expect: {status: 403, body_contains: ["unmapped fields: scoperigNoSuchMutation"], ghp_denial: true}

# GQL-C34: a documented limitation. The scalar name is not real, so GHP
# passes it (scalar leaf under the always-allowed repository) and GitHub
# rejects it in its own error.
- id: GQL-C34.scalar-leaf-passes
  claim: GQL-C34
  doc: docs/features/token-scoping.md#known-limitations
  description: An unmapped scalar leaf under an always-allowed parent passes static analysis and reaches GitHub.
  profile: perm-ro
  kind: graphql
  query: |
    { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name scoperigUnknownScalar } }
  expect:
    status: 200
    ghp_denial: false
    body_contains: ["scoperigUnknownScalar"]
    body_not_contains: ["GraphQL request references unmapped fields"]

# GQL-C35: no variable pins a lookup when the document has more than one
# operation (resolveVariables), so a repository-restricted token is denied
# (the repo-A control). Tokens with no repository restriction are
# unaffected: GitHub runs the operation that operationName selects.
- id: GQL-C35.perm-only-multi-op-variables
  claim: GQL-C35
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A permission-only token may send a variable-driven repository lookup that the variable rule would not pin.
  profile: perm-ro
  kind: graphql
  operation_name: Lookup
  query: |
    query Lookup($o: String!, $n: String!) { repository(owner: $o, name: $n) { name } }
    query Other { viewer { login } }
  variables: {o: "{{.RepoA.Owner}}", n: "{{.RepoA.Name}}"}
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C35.open-multi-op-variables
  claim: GQL-C35
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An open-scoped token may send a variable-driven repository lookup that the variable rule would not pin.
  profile: open
  kind: graphql
  operation_name: Lookup
  query: |
    query Lookup($o: String!, $n: String!) { repository(owner: $o, name: $n) { name } }
    query Other { viewer { login } }
  variables: {o: "{{.RepoA.Owner}}", n: "{{.RepoA.Name}}"}
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C35.repo-scoped-multi-op-variables
  claim: GQL-C35
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Control - the same request with a token scoped to A is denied, because the variables do not pin the lookup.
  profile: repo-A
  kind: graphql
  operation_name: Lookup
  query: |
    query Lookup($o: String!, $n: String!) { repository(owner: $o, name: $n) { name } }
    query Other { viewer { login } }
  variables: {o: "{{.RepoA.Owner}}", n: "{{.RepoA.Name}}"}
  expect: {status: 403, body_contains: ["literal string arguments"], ghp_denial: true}

# GQL-C36: fragments, aliases and multiple operations. The analyzer walks
# fragment bodies and every operation in the document, whatever
# operationName selects, and checks field names, not aliases.
- id: GQL-C36.named-fragment-scope
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A pullRequests selection inside a named fragment still needs pull_requests:read.
  profile: perm-issues-ro
  kind: graphql
  query: |
    query { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { ...F } }
    fragment F on Repository { pullRequests(first: 1) { nodes { number } } }
  expect: {status: 403, body_contains: ["Token does not grant required GraphQL scopes", "pull_requests:read"], ghp_denial: true}

- id: GQL-C36.named-fragment-allowed
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Control - a named fragment with metadata only is allowed for a repository-scoped token.
  profile: repo-A
  kind: graphql
  query: |
    query { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { ...F } }
    fragment F on Repository { name }
  expect:
    status: 200
    body_not_contains: ['"errors"']
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C36.aliased-repository-b
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: An alias on repository(owner, name) does not hide the repository; B is denied for a token scoped to A.
  profile: repo-A
  kind: graphql
  query: |
    { mine: repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name } }
  expect: {status: 403, body_contains: ["Token is not scoped to"], ghp_denial: true}

# GitHub runs one operation per request: the one operationName names, or
# the only one. GHP analyses that operation (selectOperation), so the other
# operations in the document are not checked; a document with several
# operations and no operationName is rejected.
- id: GQL-C36.operation-name-selects-b-denied
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: With several operations, the one operationName selects is analysed; selecting the lookup of B is denied for a token scoped to A.
  profile: repo-A
  kind: graphql
  operation_name: Bad
  query: |
    query Good { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name } }
    query Bad { repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name } }
  expect: {status: 403, body_contains: ["Token is not scoped to"], ghp_denial: true}

- id: GQL-C36.operation-name-selects-a-allowed
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: Control - the same document with operationName selecting the lookup of A is allowed, and GitHub runs only that operation.
  profile: repo-A
  kind: graphql
  operation_name: Good
  query: |
    query Good { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name } }
    query Bad { repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name } }
  expect:
    status: 200
    body_not_contains: ['"errors"', "{{.RepoB.Name}}"]
    json: {"$.data.repository.name": "{{.RepoA.Name}}"}

- id: GQL-C36.multiple-ops-without-name
  claim: GQL-C36
  doc: docs/features/token-scoping.md#graphql-scope-enforcement
  description: A scoped token's document with several operations and no operationName is rejected (it cannot be scoped).
  profile: repo-A
  kind: graphql
  query: |
    query Good { repository(owner: "{{.RepoA.Owner}}", name: "{{.RepoA.Name}}") { name } }
    query Bad { repository(owner: "{{.RepoB.Owner}}", name: "{{.RepoB.Name}}") { name } }
  expect: {status: 400, body_contains: ["operationName is required"]}
