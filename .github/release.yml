changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: "🔒 Security"
      labels:
        - security
    - title: "🚀 Features & Enhancements"
      labels:
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
    - title: "📖 Documentation"
      labels:
        - documentation
    - title: "📦 Dependencies"
      labels:
        - dependencies
    - title: "🧹 Other Changes"
      labels:
        - "*"
