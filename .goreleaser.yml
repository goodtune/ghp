version: 2

before:
  hooks:
    - uvx --with mkdocs-shadcn==0.10.2 mkdocs build --site-dir internal/docs/site

builds:
  - main: ./cmd/ghp
    binary: ghp
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X main.version={{.Version}}
    targets:
      - linux_amd64
      - linux_arm64
      - darwin_amd64
      - darwin_arm64
      - windows_amd64
      - windows_arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

nfpms:
  - id: ghp
    package_name: ghp
    vendor: goodtune
    homepage: https://github.com/goodtune/ghp
    maintainer: goodtune <goodtune@users.noreply.github.com>
    description: GitHub Proxy for Autonomous Coding Agents
    license: MIT
    formats:
      - rpm
      - deb
      - apk
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/ghp.service
        dst: /usr/lib/systemd/system/ghp.service
        type: config
      - src: packaging/systemd/ghp.socket
        dst: /usr/lib/systemd/system/ghp.socket
        type: config
      - src: packaging/config.yaml
        dst: /etc/ghp/config.yaml
        type: config|noreplace
    scripts:
      postinstall: packaging/scripts/postinstall.sh
      preremove: packaging/scripts/preremove.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

dockers_v2:
  - images:
      - "ghcr.io/goodtune/ghp"
    tags:
      - "{{ .Tag }}"
      - latest
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.goreleaser
