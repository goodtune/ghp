{{define "title"}}Dashboard — GitHub Proxy{{end}}

{{define "content"}}
<div class="dashboard-header">
    <h1>Your Tokens</h1>
    {{if .Tokens}}
    <button class="btn-primary" data-on:click="@get('/dashboard/token/add/')">New Token</button>
    {{end}}
</div>
{{if .Tokens}}
<div class="card-grid" id="token-grid">
    {{range .Tokens}}
    {{template "token_card" .}}
    {{end}}
</div>
{{else}}
{{template "empty_state" .}}
{{end}}
{{end}}

{{template "base" .}}
