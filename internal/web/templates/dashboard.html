<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghp — Dashboard</title>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <script src="/static/ghp-repo-select.js"></script>
    <script src="/static/ghp-permission-select.js"></script>
    <script src="/static/ghp-stepper.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <img src="/static/octobear.png" alt="" width="32" height="32">
            <span>ghp</span>
        </div>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
            <span class="username">{{ .Username }}</span>
            {{ if eq .Role "admin" }}<a href="/admin" class="btn btn-ghost">Admin</a>{{ end }}
            <button class="btn btn-ghost" onclick="logout()">Sign out</button>
        </div>
    </header>

    <main class="container">
        <div class="section-header">
            <h2>Your Tokens</h2>
            <button class="btn btn-primary" onclick="openStepper()">New Token</button>
        </div>
        <div id="token-grid" class="token-grid">
            <!-- JS renders token cards or empty state here -->
        </div>
    </main>

    <ghp-stepper id="stepper">
        <div slot="step-0">
            <div class="form-group">
                <label>Repository</label>
                <ghp-repo-select id="repo-select" mode="single" placeholder="Loading repositories..."></ghp-repo-select>
            </div>
        </div>
        <div slot="step-1">
            <div class="form-group">
                <label>Permissions</label>
                <ghp-permission-select id="perm-select"></ghp-permission-select>
            </div>
        </div>
        <div slot="step-2">
            <div class="form-group">
                <label for="duration">Duration</label>
                <select id="duration">
                    <option value="8h">8 hours</option>
                    <option value="24h" selected>24 hours</option>
                    <option value="48h">48 hours</option>
                    <option value="168h">7 days</option>
                </select>
            </div>
            <div class="form-group">
                <label for="session">Session identifier (optional)</label>
                <input type="text" id="session" placeholder="claude-code-feature-123">
            </div>
        </div>
        <div slot="step-3" id="step-confirm">
            <!-- JS renders confirm summary + create button + token display here -->
        </div>
    </ghp-stepper>

    <script>
        // ── API helper ──────────────────────────────────────────────
        async function api(method, path, body) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const resp = await fetch(path, opts);
            return resp.json();
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function logout() {
            await api('POST', '/auth/logout');
            window.location.href = '/login';
        }

        // ── Stepper setup ───────────────────────────────────────────
        const stepper = document.getElementById('stepper');
        const repoSelect = document.getElementById('repo-select');
        const permSelect = document.getElementById('perm-select');

        // All proxy-token scopes available at write level
        const proxyPermissions = {
            contents: 'write', pulls: 'write', issues: 'write',
            statuses: 'write', checks: 'write', actions: 'write', metadata: 'read'
        };
        permSelect.permissions = proxyPermissions;

        stepper.steps = [
            { title: 'Select Repository', validate: () => !!repoSelect.value },
            { title: 'Set Permissions', validate: () => Object.keys(permSelect.value).length > 0 },
            { title: 'Details' },
            { title: 'Confirm & Create' },
        ];

        function openStepper() {
            repoSelect.value = '';
            permSelect.permissions = proxyPermissions;
            document.getElementById('duration').value = '24h';
            document.getElementById('session').value = '';
            document.getElementById('step-confirm').innerHTML = '';
            stepper.open();
        }

        stepper.addEventListener('step-change', (e) => {
            if (e.detail.step === 3) {
                const repo = repoSelect.value;
                const scopes = permSelect.value;
                const duration = document.getElementById('duration').value;
                const session = document.getElementById('session').value;

                const scopeChips = Object.entries(scopes)
                    .map(([k, v]) => '<span class="scope-chip">' + esc(k + ':' + v) + '</span>')
                    .join('');

                let html = '<div class="confirm-summary">';
                html += '<p><strong>Repository:</strong> ' + esc(repo) + '</p>';
                html += '<p><strong>Permissions:</strong> ' + scopeChips + '</p>';
                html += '<p><strong>Duration:</strong> ' + esc(duration) + '</p>';
                if (session) html += '<p><strong>Session:</strong> ' + esc(session) + '</p>';
                html += '</div>';
                html += '<button class="btn btn-primary" id="create-btn" onclick="createToken()">Create Token</button>';

                document.getElementById('step-confirm').innerHTML = html;
            }
        });

        // ── Create token ────────────────────────────────────────────
        async function createToken() {
            const repo = repoSelect.value;
            const scopes = permSelect.value;
            const duration = document.getElementById('duration').value;
            const session = document.getElementById('session').value;

            const scopeStr = Object.entries(scopes).map(([k, v]) => k + ':' + v).join(',');

            const body = { repository: repo, scopes: scopeStr, duration: duration };
            if (session) body.session_id = session;

            const btn = document.getElementById('create-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const data = await api('POST', '/api/tokens', body);

            if (data.token) {
                let html = '<div class="token-display">' + esc(data.token) + '</div>';
                html += '<p style="color:var(--color-warning);margin-top:0.5rem;font-size:0.875rem">';
                html += 'This token will only be shown once. Copy it now.</p>';
                document.getElementById('step-confirm').innerHTML = html;
                stepper.hideNav();
                loadTokens();
            } else {
                btn.disabled = false;
                btn.textContent = 'Create Token';
                alert(data.message || 'Failed to create token');
            }
        }

        // ── Load user repos ─────────────────────────────────────────
        async function loadUserRepos() {
            const data = await api('GET', '/api/github/repositories');
            if (Array.isArray(data)) {
                repoSelect.repos = data;
            }
            repoSelect.setAttribute('placeholder', 'Search repositories...');
        }

        // ── Format expiry ───────────────────────────────────────────
        function formatExpiry(expiresAt, revokedAt) {
            if (revokedAt) return 'Revoked';
            const now = new Date();
            const expires = new Date(expiresAt);
            const diffMs = expires - now;

            if (diffMs <= 0) {
                const ago = Math.abs(diffMs);
                return 'Expired ' + formatRelative(ago) + ' ago';
            }
            return 'Expires in ' + formatRelative(diffMs);
        }

        function formatRelative(ms) {
            const minutes = Math.floor(ms / 60000);
            const hours = Math.floor(ms / 3600000);
            const days = Math.floor(ms / 86400000);
            if (days > 0) return days + 'd';
            if (hours > 0) return hours + 'h';
            if (minutes > 0) return minutes + 'm';
            return '<1m';
        }

        // ── Load tokens ─────────────────────────────────────────────
        async function loadTokens() {
            const tokens = await api('GET', '/api/tokens');
            const container = document.getElementById('token-grid');

            if (!Array.isArray(tokens) || tokens.length === 0) {
                container.innerHTML = '<div class="empty-state">'
                    + '<img src="/static/octobear.png" alt="">'
                    + '<p>No tokens yet. Create one to get started.</p>'
                    + '<button class="btn btn-primary" onclick="openStepper()">New Token</button>'
                    + '</div>';
                return;
            }

            let html = '';
            for (const t of tokens) {
                const now = new Date();
                const expires = new Date(t.expires_at);
                let status, statusClass;
                if (t.revoked_at) { status = 'Revoked'; statusClass = 'revoked'; }
                else if (expires < now) { status = 'Expired'; statusClass = 'expired'; }
                else { status = 'Active'; statusClass = 'active'; }

                const repos = Array.isArray(t.repositories) ? t.repositories.join(', ') : (t.repositories || '');
                let scopes = [];
                if (typeof t.scopes === 'string') {
                    scopes = t.scopes.split(',');
                } else if (t.scopes && typeof t.scopes === 'object') {
                    scopes = Object.entries(t.scopes).map(([k, v]) => k + ':' + v);
                }

                html += '<div class="token-card">';
                html += '<div class="token-card-header">';
                html += '<div>';
                html += '<div class="token-card-repo">' + esc(repos) + '</div>';
                html += '<div class="token-card-prefix">' + esc(t.token_prefix) + '...</div>';
                html += '</div>';
                html += '<span class="status status-' + statusClass + '">';
                html += '<span class="status-dot"></span>';
                html += status;
                html += '</span>';
                html += '</div>';

                html += '<div class="token-card-scopes">';
                for (const scope of scopes) {
                    html += '<span class="scope-chip">' + esc(scope.trim()) + '</span>';
                }
                html += '</div>';

                if (t.session_id) {
                    html += '<div class="token-card-session">' + esc(t.session_id) + '</div>';
                }

                html += '<div class="token-card-footer">';
                html += '<span class="token-card-meta">' + formatExpiry(t.expires_at, t.revoked_at) + '</span>';
                if (status === 'Active') {
                    html += '<button class="btn btn-danger" onclick="revokeToken(\'' + t.id + '\')">Revoke</button>';
                }
                html += '</div>';
                html += '</div>';
            }
            container.innerHTML = html;
        }

        // ── Revoke token ────────────────────────────────────────────
        async function revokeToken(id) {
            if (!confirm('Revoke this token?')) return;
            await api('DELETE', '/api/tokens/' + id);
            loadTokens();
        }

        // ── Init ────────────────────────────────────────────────────
        loadUserRepos();
        loadTokens();
    </script>
</body>
</html>
