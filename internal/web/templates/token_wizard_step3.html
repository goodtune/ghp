{{define "wizard_step3"}}
<div class="wizard-dots">
    <span class="wizard-dot active"></span>
    <span class="wizard-dot active"></span>
    <span class="wizard-dot active"></span>
    <span class="wizard-dot"></span>
</div>
<button class="modal-close" data-on-click="$modalOpen = false">&times;</button>
<h2>Details</h2>
<form data-on-submit.prevent="@post('/dashboard/token/add/')">
    <input type="hidden" name="step" value="3">
    <div class="form-group">
        <label for="duration">Duration</label>
        <select id="duration" name="duration">
            <option value="1h" {{if eq .Duration "1h"}}selected{{end}}>1 hour</option>
            <option value="8h" {{if eq .Duration "8h"}}selected{{end}}>8 hours</option>
            <option value="24h" {{if or (eq .Duration "24h") (eq .Duration "")}}selected{{end}}>24 hours</option>
        </select>
    </div>
    <div class="form-group">
        <label for="session_id">Session identifier (optional)</label>
        <input type="text" id="session_id" name="session_id" placeholder="claude-code-feature-123" value="{{.SessionID}}">
    </div>
    <div class="modal-actions">
        <button type="button" class="btn-outline" data-on-click="@post('/dashboard/token/add/', {body: new URLSearchParams({back: 'true', step: '3'})})">Back</button>
        <button type="submit" class="btn-primary">Next</button>
    </div>
</form>
{{end}}
