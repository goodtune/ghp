<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghp — Admin</title>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <script type="module" src="/static/datastar.min.js"></script>
    <script src="/static/ghp-repo-select.js"></script>
    <script src="/static/ghp-permission-select.js"></script>
</head>
<body data-signals="{tab: 'users', agentOpen: false, agentStep: 0, installationId: '', agentRepos: '[]', agentPerms: '{}', agentDuration: '24h', agentSession: ''}">
    <header class="header">
        <div class="header-brand">
            <img src="/static/octobear.png" alt="" width="32" height="32">
            <span>GitHub Proxy</span>
        </div>
        <nav class="header-nav">
            <a href="/" class="nav-link{{ if eq .Page "dashboard" }} active{{ end }}">Dashboard</a>
            {{ if eq .Role "admin" }}<a href="/admin" class="nav-link{{ if eq .Page "admin" }} active{{ end }}">Admin</a>{{ end }}
        </nav>
        <div class="header-actions">
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
            <a href="https://github.com/{{ .Username }}" target="_blank" rel="noopener" class="avatar-link">
                <img src="https://github.com/{{ .Username }}.png?size=64" alt="{{ .Username }}" class="avatar" width="32" height="32">
            </a>
            <button class="btn btn-ghost" data-on:click="@post('/ui/logout')">Sign out</button>
        </div>
    </header>

    <main class="container">
        <div class="tabs" role="tablist">
            <button class="tab" role="tab" data-class:active="$tab === 'users'" data-on:click="$tab = 'users'">Users</button>
            <button class="tab" role="tab" data-class:active="$tab === 'tokens'" data-on:click="$tab = 'tokens'">Tokens</button>
        </div>

        <!-- Users panel (SSE-loaded, hidden when tokens tab active) -->
        <section data-show="$tab === 'users'" id="admin-users-panel" role="tabpanel">
            <div class="loading">Loading...</div>
        </section>

        <!-- Tokens panel (SSE-loaded, hidden when users tab active) -->
        <section data-show="$tab === 'tokens'" id="admin-tokens-panel" role="tabpanel">
            <div class="loading">Loading...</div>
        </section>

        <!-- Establish persistent SSE connection for live admin data -->
        <div data-init="@get('/ui/admin/stream')"></div>

        <!-- Hidden inputs bridge web component values to Datastar signals -->
        <input type="hidden" id="agent-repos-signal" data-bind:agentRepos>
        <input type="hidden" id="agent-perms-signal" data-bind:agentPerms>

        <!-- ── Agent token creation stepper ─────────────────────── -->
        <div class="modal-overlay" data-class:open="$agentOpen" data-on:click="$agentOpen = false">
            <div class="modal" onclick="event.stopPropagation()">
                <button class="stepper-close" data-on:click="$agentOpen = false" aria-label="Close">&times;</button>

                <div class="stepper-dots">
                    <span class="stepper-dot" data-class:active="$agentStep === 0" data-class:completed="$agentStep > 0"></span>
                    <span class="stepper-dot" data-class:active="$agentStep === 1" data-class:completed="$agentStep > 1"></span>
                    <span class="stepper-dot" data-class:active="$agentStep === 2" data-class:completed="$agentStep > 2"></span>
                    <span class="stepper-dot" data-class:active="$agentStep === 3" data-class:completed="$agentStep > 3"></span>
                    <span class="stepper-dot" data-class:active="$agentStep === 4"></span>
                </div>

                <!-- Step 0: Select Installation -->
                <div data-show="$agentStep === 0">
                    <h3 class="stepper-title">Select Installation</h3>
                    <div class="form-group">
                        <label for="installation-id">Installation</label>
                        <select id="installation-id" data-bind:installationId onchange="onInstallationChange()">
                            <option value="">Loading installations...</option>
                        </select>
                    </div>
                    <div class="stepper-actions">
                        <span></span>
                        <button class="btn btn-primary" onclick="if(!document.getElementById('installation-id').value)event.stopImmediatePropagation()" data-on:click="$agentStep = 1">Next</button>
                    </div>
                </div>

                <!-- Step 1: Select Repositories -->
                <div data-show="$agentStep === 1">
                    <h3 class="stepper-title">Select Repositories</h3>
                    <div class="form-group">
                        <label>Repositories</label>
                        <ghp-repo-select id="agent-repo-select" mode="multi" placeholder="Select installation first..." disabled></ghp-repo-select>
                    </div>
                    <div class="stepper-actions">
                        <button class="btn btn-ghost" data-on:click="$agentStep = 0">Back</button>
                        <button class="btn btn-primary" onclick="if(!syncAgentRepos())event.stopImmediatePropagation()" data-on:click="$agentStep = 2">Next</button>
                    </div>
                </div>

                <!-- Step 2: Permissions -->
                <div data-show="$agentStep === 2">
                    <h3 class="stepper-title">Set Permissions</h3>
                    <div class="form-group">
                        <label>Permissions</label>
                        <ghp-permission-select id="agent-perm-select"></ghp-permission-select>
                    </div>
                    <div class="stepper-actions">
                        <button class="btn btn-ghost" data-on:click="$agentStep = 1">Back</button>
                        <button class="btn btn-primary" onclick="if(!syncAgentPerms())event.stopImmediatePropagation()" data-on:click="$agentStep = 3">Next</button>
                    </div>
                </div>

                <!-- Step 3: Details -->
                <div data-show="$agentStep === 3">
                    <h3 class="stepper-title">Details</h3>
                    <div class="form-group">
                        <label for="agent-duration">Duration</label>
                        <select id="agent-duration" data-bind:agentDuration>
                            <option value="8h">8 hours</option>
                            <option value="24h" selected>24 hours</option>
                            <option value="48h">48 hours</option>
                            <option value="168h">7 days</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="agent-session">Session identifier (optional)</label>
                        <input type="text" id="agent-session" data-bind:agentSession placeholder="ci-agent-run-42">
                    </div>
                    <div class="stepper-actions">
                        <button class="btn btn-ghost" data-on:click="$agentStep = 2">Back</button>
                        <button class="btn btn-primary" onclick="populateAgentConfirm()" data-on:click="$agentStep = 4">Next</button>
                    </div>
                </div>

                <!-- Step 4: Confirm & Create -->
                <div data-show="$agentStep === 4" id="agent-step-confirm">
                    <h3 class="stepper-title">Confirm &amp; Create</h3>
                    <dl class="confirm-summary" id="agent-confirm-details"></dl>
                    <button class="btn btn-primary" data-on:click="@post('/ui/agent-tokens')">Create Agent Token</button>
                    <div class="stepper-actions">
                        <button class="btn btn-ghost" data-on:click="$agentStep = 3">Back</button>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // ── Minimal JS: bridge web components + load installations ──

        const agentRepoSelect = document.getElementById('agent-repo-select');
        const agentPermSelect = document.getElementById('agent-perm-select');
        const agentReposSignal = document.getElementById('agent-repos-signal');
        const agentPermsSignal = document.getElementById('agent-perms-signal');
        let installations = [];

        function syncAgentRepos() {
            const v = agentRepoSelect.value;
            if (!Array.isArray(v) || v.length === 0) return false;
            agentReposSignal.value = JSON.stringify(v);
            agentReposSignal.dispatchEvent(new Event('input', { bubbles: true }));
            return true;
        }

        function syncAgentPerms() {
            const v = agentPermSelect.value;
            if (Object.keys(v).length === 0) return false;
            agentPermsSignal.value = JSON.stringify(v);
            agentPermsSignal.dispatchEvent(new Event('input', { bubbles: true }));
            return true;
        }

        function populateAgentConfirm() {
            syncAgentRepos();
            syncAgentPerms();
            const instId = document.getElementById('installation-id').value;
            const inst = installations.find(i => i.id === parseInt(instId));
            const repos = agentRepoSelect.value;
            const scopes = agentPermSelect.value;
            const duration = document.getElementById('agent-duration').value;
            const session = document.getElementById('agent-session').value;
            const chips = Object.entries(scopes)
                .map(([k, v]) => '<span class="scope-chip">' + esc(k + ':' + v) + '</span>')
                .join(' ');
            const repoList = Array.isArray(repos) ? repos.join(', ') : repos;
            let html = '<dt>Installation</dt><dd>' + esc(inst ? inst.account.login : instId) + '</dd>';
            html += '<dt>Repositories</dt><dd>' + esc(repoList) + '</dd>';
            html += '<dt>Permissions</dt><dd>' + chips + '</dd>';
            html += '<dt>Duration</dt><dd>' + esc(duration) + '</dd>';
            if (session) html += '<dt>Session</dt><dd>' + esc(session) + '</dd>';
            document.getElementById('agent-confirm-details').innerHTML = html;
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function onInstallationChange() {
            const id = parseInt(document.getElementById('installation-id').value);
            agentRepoSelect.clear();
            if (!id) {
                agentRepoSelect.disabled = true;
                agentPermSelect.permissions = {};
                return;
            }
            const inst = installations.find(i => i.id === id);
            agentPermSelect.permissions = inst ? (inst.permissions || {}) : {};
            agentRepoSelect.disabled = true;
            agentRepoSelect.setAttribute('placeholder', 'Loading repositories...');
            try {
                const resp = await fetch('/api/github/installations/' + id + '/repositories');
                const data = await resp.json();
                agentRepoSelect.repos = Array.isArray(data) ? data : [];
                agentRepoSelect.disabled = false;
                agentRepoSelect.setAttribute('placeholder', 'Search repositories...');
            } catch (err) {
                agentRepoSelect.setAttribute('placeholder', 'Failed to load repositories');
            }
        }

        // Load installations on page load.
        (async function() {
            const sel = document.getElementById('installation-id');
            try {
                const resp = await fetch('/api/github/installations');
                const data = await resp.json();
                if (!Array.isArray(data) || data.length === 0) {
                    sel.innerHTML = '<option value="">No installations found</option>';
                    return;
                }
                installations = data;
                sel.innerHTML = '<option value="">Select an installation...</option>';
                for (const inst of installations) {
                    const opt = document.createElement('option');
                    opt.value = inst.id;
                    opt.textContent = inst.account.login + ' (' + inst.id + ')';
                    sel.appendChild(opt);
                }
            } catch (err) {
                sel.innerHTML = '<option value="">Failed to load installations</option>';
            }
        })();
    </script>
</body>
</html>
