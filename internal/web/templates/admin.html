<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ghp — Admin</title>
    <link rel="stylesheet" href="/static/theme.css">
    <script src="/static/theme.js"></script>
    <script src="/static/ghp-repo-select.js"></script>
    <script src="/static/ghp-permission-select.js"></script>
    <script src="/static/ghp-stepper.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-brand">
            <img src="/static/octobear.png" alt="" width="32" height="32">
            <span>ghp</span>
            <span class="badge-admin">admin</span>
        </div>
        <div class="header-actions">
            <a href="/" class="btn btn-ghost">Dashboard</a>
            <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme"></button>
            <span class="username">{{ .Username }}</span>
            <button class="btn btn-ghost" onclick="logout()">Sign out</button>
        </div>
    </header>

    <main class="container">
        <div class="tabs">
            <button class="tab active" data-tab="users" onclick="switchTab('users')">Users</button>
            <button class="tab" data-tab="tokens" onclick="switchTab('tokens')">Tokens</button>
        </div>

        <div id="panel-users" class="tab-panel active">
            <div id="users-list"></div>
        </div>

        <div id="panel-tokens" class="tab-panel">
            <div class="section-header">
                <div style="display:flex;align-items:center;gap:0.75rem;flex-wrap:wrap">
                    <div class="filter-bar">
                        <select id="filter-status" onchange="filterTokens()">
                            <option value="">All statuses</option>
                            <option value="active">Active</option>
                            <option value="expired">Expired</option>
                            <option value="revoked">Revoked</option>
                        </select>
                        <span id="filter-user-label" style="font-size:0.875rem;color:var(--color-text-secondary)"></span>
                        <button id="clear-filter" class="btn btn-ghost" style="display:none;font-size:0.8rem;padding:0.25rem 0.5rem" onclick="clearUserFilter()">Show all</button>
                    </div>
                    <button class="btn btn-primary" onclick="openAgentStepper()">New Agent Token</button>
                </div>
            </div>
            <div id="all-tokens"></div>
        </div>
    </main>

    <ghp-stepper id="agent-stepper">
        <div slot="step-0">
            <div class="form-group">
                <label for="installation-id">Installation</label>
                <select id="installation-id" onchange="onInstallationChange()">
                    <option value="">Loading installations...</option>
                </select>
            </div>
        </div>
        <div slot="step-1">
            <div class="form-group">
                <label>Repositories</label>
                <ghp-repo-select id="repo-select" mode="multi" placeholder="Select installation first..." disabled></ghp-repo-select>
            </div>
        </div>
        <div slot="step-2">
            <div class="form-group">
                <label>Permissions</label>
                <ghp-permission-select id="perm-select"></ghp-permission-select>
            </div>
        </div>
        <div slot="step-3">
            <div class="form-group">
                <label for="duration">Duration</label>
                <select id="duration">
                    <option value="8h">8 hours</option>
                    <option value="24h" selected>24 hours</option>
                    <option value="48h">48 hours</option>
                    <option value="168h">7 days</option>
                </select>
            </div>
            <div class="form-group">
                <label for="session">Session identifier (optional)</label>
                <input type="text" id="session" placeholder="ci-agent-run-42">
            </div>
        </div>
        <div slot="step-4" id="step-confirm">
            <!-- JS renders confirm summary + create button + token display -->
        </div>
    </ghp-stepper>

    <script>
        // ── API helper ──────────────────────────────────────────────
        async function api(method, path, body) {
            const opts = { method, headers: { 'Content-Type': 'application/json' } };
            if (body) opts.body = JSON.stringify(body);
            const resp = await fetch(path, opts);
            return resp.json();
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        async function logout() {
            await api('POST', '/auth/logout');
            window.location.href = '/login';
        }

        // ── Tab switching ────────────────────────────────────────────
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
        }

        // ── State ────────────────────────────────────────────────────
        let installations = [];
        let allTokens = [];
        let filterUserId = null;
        let filterUsername = null;

        const repoSelect = document.getElementById('repo-select');
        const permSelect = document.getElementById('perm-select');

        // ── Installation select ──────────────────────────────────────
        async function loadInstallations() {
            const sel = document.getElementById('installation-id');
            try {
                const data = await api('GET', '/api/github/installations');
                if (!Array.isArray(data) || data.length === 0) {
                    sel.innerHTML = '<option value="">No installations found</option>';
                    return;
                }
                installations = data;
                sel.innerHTML = '<option value="">Select an installation...</option>';
                for (const inst of installations) {
                    const opt = document.createElement('option');
                    opt.value = inst.id;
                    opt.textContent = inst.account.login + ' (' + inst.id + ')';
                    sel.appendChild(opt);
                }
            } catch (err) {
                sel.innerHTML = '<option value="">Failed to load installations</option>';
                console.error('Failed to load installations:', err);
            }
        }

        async function onInstallationChange() {
            const id = parseInt(document.getElementById('installation-id').value);
            repoSelect.clear();

            if (!id) {
                repoSelect.disabled = true;
                permSelect.permissions = {};
                return;
            }

            // Set permissions from installation.
            const inst = installations.find(i => i.id === id);
            permSelect.permissions = inst ? (inst.permissions || {}) : {};

            // Load repos.
            repoSelect.disabled = true;
            repoSelect.setAttribute('placeholder', 'Loading repositories...');

            try {
                const data = await api('GET', '/api/github/installations/' + id + '/repositories');
                repoSelect.repos = Array.isArray(data) ? data : [];
                repoSelect.disabled = false;
                repoSelect.setAttribute('placeholder', 'Search repositories...');
            } catch (err) {
                repoSelect.setAttribute('placeholder', 'Failed to load repositories');
                console.error('Failed to load repositories:', err);
            }
        }

        // ── Agent stepper ────────────────────────────────────────────
        const agentStepper = document.getElementById('agent-stepper');
        agentStepper.steps = [
            { title: 'Select Installation', validate: () => !!document.getElementById('installation-id').value },
            { title: 'Select Repositories', validate: () => repoSelect.value.length > 0 },
            { title: 'Set Permissions', validate: () => Object.keys(permSelect.value).length > 0 },
            { title: 'Details' },
            { title: 'Confirm & Create' },
        ];

        function openAgentStepper() {
            document.getElementById('installation-id').value = '';
            repoSelect.clear();
            repoSelect.disabled = true;
            repoSelect.setAttribute('placeholder', 'Select installation first...');
            permSelect.permissions = {};
            document.getElementById('duration').value = '24h';
            document.getElementById('session').value = '';
            document.getElementById('step-confirm').innerHTML = '';
            agentStepper.open();
        }

        agentStepper.addEventListener('step-change', (e) => {
            if (e.detail.step === 4) {
                const instId = document.getElementById('installation-id').value;
                const inst = installations.find(i => i.id === parseInt(instId));
                const repos = repoSelect.value;
                const scopes = permSelect.value;
                const duration = document.getElementById('duration').value;
                const session = document.getElementById('session').value;

                const scopeChips = Object.entries(scopes)
                    .map(([k, v]) => '<span class="scope-chip">' + esc(k + ':' + v) + '</span>')
                    .join('');

                const repoList = Array.isArray(repos) ? repos.join(', ') : repos;

                let html = '<div class="confirm-summary">';
                html += '<p><strong>Installation:</strong> ' + esc(inst ? inst.account.login : instId) + '</p>';
                html += '<p><strong>Repositories:</strong> ' + esc(repoList) + '</p>';
                html += '<p><strong>Permissions:</strong> ' + scopeChips + '</p>';
                html += '<p><strong>Duration:</strong> ' + esc(duration) + '</p>';
                if (session) html += '<p><strong>Session:</strong> ' + esc(session) + '</p>';
                html += '</div>';
                html += '<button class="btn btn-primary" id="create-btn" onclick="createAgentToken()">Create Agent Token</button>';

                document.getElementById('step-confirm').innerHTML = html;
            }
        });

        // ── Create agent token ───────────────────────────────────────
        async function createAgentToken() {
            const installationId = parseInt(document.getElementById('installation-id').value);
            const duration = document.getElementById('duration').value;
            const session = document.getElementById('session').value;
            const selectedRepos = repoSelect.value;
            const scopes = permSelect.value;

            const scopeStr = Object.entries(scopes).map(([k, v]) => k + ':' + v).join(',');

            const body = {
                type: 'agent',
                installation_id: installationId,
                repositories: selectedRepos,
                scopes: scopeStr,
                duration: duration,
            };
            if (session) body.session_id = session;

            const btn = document.getElementById('create-btn');
            btn.disabled = true;
            btn.textContent = 'Creating...';

            const data = await api('POST', '/api/tokens', body);

            if (data.token) {
                let html = '<div class="token-display">' + esc(data.token) + '</div>';
                html += '<p style="color:var(--color-warning);margin-top:0.5rem;font-size:0.875rem">';
                html += 'This token will only be shown once. Copy it now.</p>';
                document.getElementById('step-confirm').innerHTML = html;
                agentStepper.hideNav();
                loadAllTokens();
            } else {
                btn.disabled = false;
                btn.textContent = 'Create Agent Token';
                alert(data.message || 'Failed to create agent token');
            }
        }

        // ── Users ────────────────────────────────────────────────────
        async function loadUsers() {
            const users = await api('GET', '/api/users');
            const container = document.getElementById('users-list');

            if (!Array.isArray(users) || users.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No users found</p></div>';
                return;
            }

            let html = '<div class="table-wrap"><table>';
            html += '<tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>';
            for (const u of users) {
                const created = new Date(u.created_at).toLocaleString();
                const badgeClass = u.role === 'admin' ? 'badge-admin' : 'badge-user';
                html += '<tr>';
                html += '<td>' + esc(u.username) + '</td>';
                html += '<td><span class="badge ' + badgeClass + '">' + esc(u.role) + '</span></td>';
                html += '<td>' + created + '</td>';
                html += '<td><a class="link" href="#" onclick="viewUserTokens(\'' + u.id + '\', \'' + esc(u.username) + '\'); return false;">View tokens</a></td>';
                html += '</tr>';
            }
            html += '</table></div>';
            container.innerHTML = html;
        }

        // ── User token filter ────────────────────────────────────────
        function viewUserTokens(userId, username) {
            filterUserId = userId;
            filterUsername = username;
            switchTab('tokens');
            filterTokens();
        }

        function clearUserFilter() {
            filterUserId = null;
            filterUsername = null;
            filterTokens();
        }

        // ── Tokens ───────────────────────────────────────────────────
        async function loadAllTokens() {
            const tokens = await api('GET', '/api/tokens?all=true');
            allTokens = Array.isArray(tokens) ? tokens : [];
            filterTokens();
        }

        function filterTokens() {
            let tokens = allTokens;

            // Filter by user
            if (filterUserId) {
                tokens = tokens.filter(t => t.user_id === filterUserId);
                document.getElementById('filter-user-label').textContent = 'Showing tokens for ' + filterUsername;
                document.getElementById('clear-filter').style.display = '';
            } else {
                document.getElementById('filter-user-label').textContent = '';
                document.getElementById('clear-filter').style.display = 'none';
            }

            // Filter by status
            const statusFilter = document.getElementById('filter-status').value;
            if (statusFilter) {
                tokens = tokens.filter(t => {
                    const now = new Date();
                    const expires = new Date(t.expires_at);
                    if (t.revoked_at) return statusFilter === 'revoked';
                    if (expires < now) return statusFilter === 'expired';
                    return statusFilter === 'active';
                });
            }

            const container = document.getElementById('all-tokens');
            if (tokens.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No tokens found</p></div>';
                return;
            }

            container.innerHTML = renderTokenTable(tokens);
        }

        function renderTokenTable(tokens) {
            let html = '<div class="table-wrap"><table>';
            html += '<tr><th>Prefix</th><th>Type</th><th>Repos</th><th>Scopes</th><th>Session</th><th>Status</th><th>Expires</th><th></th></tr>';
            for (const t of tokens) {
                const now = new Date();
                const expires = new Date(t.expires_at);
                let status, badgeClass;
                if (t.revoked_at) { status = 'revoked'; badgeClass = 'badge-revoked'; }
                else if (expires < now) { status = 'expired'; badgeClass = 'badge-expired'; }
                else { status = 'active'; badgeClass = 'badge-active'; }

                const scopes = typeof t.scopes === 'string' ? t.scopes : JSON.stringify(t.scopes);
                const repos = Array.isArray(t.repositories) ? t.repositories.join(', ') : (t.repositories || '');
                const tokenType = t.token_type || 'proxy';
                const typeBadge = tokenType === 'agent' ? 'badge-agent' : 'badge-proxy';

                html += '<tr>';
                html += '<td class="text-mono">' + esc(t.token_prefix) + '...</td>';
                html += '<td><span class="badge ' + typeBadge + '">' + esc(tokenType) + '</span></td>';
                html += '<td>' + esc(repos) + '</td>';
                html += '<td>' + esc(scopes) + '</td>';
                html += '<td>' + esc(t.session_id || '-') + '</td>';
                html += '<td><span class="badge ' + badgeClass + '">' + status + '</span></td>';
                html += '<td>' + formatExpiry(t.expires_at, t.revoked_at) + '</td>';
                html += '<td>' + (status === 'active' ? '<button class="btn btn-danger" onclick="revokeToken(\'' + t.id + '\')">Revoke</button>' : '') + '</td>';
                html += '</tr>';
            }
            html += '</table></div>';
            return html;
        }

        // ── Format expiry ────────────────────────────────────────────
        function formatExpiry(expiresAt, revokedAt) {
            if (revokedAt) return 'Revoked';
            const now = new Date();
            const expires = new Date(expiresAt);
            const diffMs = expires - now;

            if (diffMs <= 0) {
                const ago = Math.abs(diffMs);
                return 'Expired ' + formatRelative(ago) + ' ago';
            }
            return 'Expires in ' + formatRelative(diffMs);
        }

        function formatRelative(ms) {
            const minutes = Math.floor(ms / 60000);
            const hours = Math.floor(ms / 3600000);
            const days = Math.floor(ms / 86400000);
            if (days > 0) return days + 'd';
            if (hours > 0) return hours + 'h';
            if (minutes > 0) return minutes + 'm';
            return '<1m';
        }

        // ── Revoke token ─────────────────────────────────────────────
        async function revokeToken(id) {
            if (!confirm('Revoke this token?')) return;
            await api('DELETE', '/api/tokens/' + id);
            loadAllTokens();
        }

        // ── Init ─────────────────────────────────────────────────────
        loadInstallations();
        loadUsers();
        loadAllTokens();
    </script>
</body>
</html>
